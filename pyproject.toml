[build-system]
requires = ["setuptools>=68", "wheel", "cmake>=3.24", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-moea"
version = "0.2.0"
description = "GPU-accelerated multi-objective evolutionary algorithms for PyTorch"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["torch>=2.1"]

[tool.setuptools]
packages = ["cuda_moea"]
package-dir = {"" = "python"}

[tool.setuptools.package-data]
cuda_moea = ["lib/*.so", "sdk/**/*", "native_problems/**/*"]
